controller:

  image:
    registry: docker.io
    repository: satyamgrao007/lovable-jenkins-controller
    tag: latest
    pullPolicy: Always

  serviceType: ClusterIP

  servicePort: 8080

  targetPort: 8080

  numExecutors: 0

  executorMode: NORMAL

  javaOpts: >-
    -Djenkins.install.runSetupWizard=false

  admin:

    username: ${admin_user}

    password: ${admin_password}

  resources:

    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: "2"
      memory: 4Gi

  persistence:

    enabled: true

    storageClass: ${storage_class}

    size: ${storage_size}

    accessMode: ReadWriteOnce

  initializeOnce: true

  overwritePlugins: false

  installLatestPlugins: false

  installLatestSpecifiedPlugins: false

  installPlugins: []

  disableRememberMe: false

  JCasC:

    enabled: true

    defaultConfig: false

  #########################################################
  # Mount ConfigMap
  #########################################################

  additionalVolumes:

    - name: jcasc-config

      configMap:

        name: jenkins-jcasc

  additionalVolumeMounts:

    - name: jcasc-config

      mountPath: /var/jenkins_home/casc_configs

      readOnly: true

  #########################################################
  # Environment Variables
  #########################################################

  containerEnv:

    - name: CASC_JENKINS_CONFIG
      value: /var/jenkins_home/casc_configs

    #####################################################
    # Jenkins
    #####################################################

    - name: JENKINS_ADMIN_USER
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: JENKINS_ADMIN_USER

    - name: JENKINS_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: JENKINS_ADMIN_PASSWORD

    #####################################################
    # GitHub (Application Repository)
    #####################################################

    - name: GITHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: GITHUB_USERNAME

    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: GITHUB_TOKEN

    #####################################################
    # GitOps Repository
    #####################################################

    - name: GITOPS_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: GITOPS_USERNAME

    - name: GITOPS_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: GITOPS_TOKEN

    #####################################################
    # DockerHub
    #####################################################

    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: DOCKERHUB_USERNAME

    - name: DOCKERHUB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: DOCKERHUB_PASSWORD

    #####################################################
    # SonarQube
    #####################################################

    - name: SONAR_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: SONAR_TOKEN

    #####################################################
    # SMTP
    #####################################################

    - name: SMTP_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: SMTP_USERNAME

    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jenkins-secrets
          key: SMTP_PASSWORD

#########################################################
# Jenkins Agent
#########################################################

agent:

  enabled: false

#########################################################
# RBAC
#########################################################

rbac:

  create: false

#########################################################
# Service Account
#########################################################

serviceAccount:

  create: false

  name: jenkins

#########################################################
# Network Policy
#########################################################

networkPolicy:

  enabled: false

#########################################################
# Persistence
#########################################################

persistence:

  enabled: false