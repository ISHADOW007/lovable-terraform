credentials:

  system:

    domainCredentials:

      #######################################################
      # Global Credentials
      #######################################################

      - credentials:

          ###################################################
          # GitHub Personal Access Token
          ###################################################

          - usernamePassword:

              id: github-creds

              scope: GLOBAL

              username: "${GITHUB_USERNAME}"

              password: "${GITHUB_TOKEN}"

              description: "GitHub Credentials"

          ###################################################
          # DockerHub
          ###################################################

          - usernamePassword:

              id: dockerhub-creds

              scope: GLOBAL

              username: "${DOCKERHUB_USERNAME}"

              password: "${DOCKERHUB_PASSWORD}"

              description: "DockerHub Credentials"

          ###################################################
          # SonarQube Token
          ###################################################

          - string:

              id: sonar-token

              scope: GLOBAL

              secret: "${SONAR_TOKEN}"

              description: "SonarQube Token"

          ###################################################
          # SMTP Password
          ###################################################

          - usernamePassword:

              id: smtp-creds

              scope: GLOBAL

              username: "${SMTP_USERNAME}"

              password: "${SMTP_PASSWORD}"

              description: "SMTP Credentials"

          
          - usernamePassword:
              id: "gitops-creds"
              username: "${GITOPS_USERNAME}"
              password: "${GITOPS_TOKEN}"
              description: "GitOps Repository Credentials"