apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  serviceAccountName: jenkins
  restartPolicy: Never

  containers:
    - name: jnlp
      image: satyamgrao007/lovable-jenkins-agent:latest
      imagePullPolicy: Always
      tty: true
      workingDir: /home/jenkins/agent
      args:
        - $(JENKINS_SECRET)
        - $(JENKINS_NAME)

      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

      volumeMounts:
        - name: workspace-volume
          mountPath: /home/jenkins/agent

  volumes:
    - name: workspace-volume
      emptyDir: {}