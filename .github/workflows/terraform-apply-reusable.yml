name: Reusable Terraform Apply

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string


jobs:
  terraform-apply:

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Debug GitHub Identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Actor: $GITHUB_ACTOR"
          echo "Event: $GITHUB_EVENT_NAME"


      - name: Check OIDC Token Availability
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC token is missing"
            exit 1
          else
            echo "OIDC token is available"
          fi


      - name: Decode OIDC Claims
        run: |
          TOKEN=$(curl -s \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value')

          echo "OIDC Claims:"
          echo $TOKEN | cut -d "." -f2 | base64 -d | jq


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::457724887427:role/github-actions-terraform-role
          aws-region: ap-south-1
          role-session-name: github-actions-terraform


      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0


      - name: Terraform Init
        run: terraform init


      - name: Terraform Apply
        run: terraform apply -auto-approve