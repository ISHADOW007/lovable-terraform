name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      stage0: ${{ steps.filter.outputs.stage0 }}
      stage1: ${{ steps.filter.outputs.stage1 }}
      stage2: ${{ steps.filter.outputs.stage2 }}
      stage3: ${{ steps.filter.outputs.stage3 }}
      stage4: ${{ steps.filter.outputs.stage4 }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            stage0:
              - 'stage-0-bootstrap/**'

            stage1:
              - 'stage-1-network/**'

            stage2:
              - 'stage-2-addons/**'

            stage3:
              - 'stage-3-platform/**'

            stage4:
              - 'stage-4-github-oidc/**'

  stage0:
    needs: detect-changes
    if: needs.detect-changes.outputs.stage0 == 'true'
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      working-directory: stage-0-bootstrap
    secrets: inherit

  stage1:
    needs: detect-changes
    if: needs.detect-changes.outputs.stage1 == 'true'
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      working-directory: stage-1-network
    secrets: inherit

  stage2:
    needs: detect-changes
    if: needs.detect-changes.outputs.stage2 == 'true'
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      working-directory: stage-2-addons
    secrets: inherit

  stage3:
    needs: detect-changes
    if: needs.detect-changes.outputs.stage3 == 'true'
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      working-directory: stage-3-platform
    secrets: inherit

  stage4:
    needs: detect-changes
    if: needs.detect-changes.outputs.stage4 == 'true'
    uses: ./.github/workflows/terraform-apply-reusable.yml
    with:
      working-directory: stage-4-github-oidc
    secrets: inherit